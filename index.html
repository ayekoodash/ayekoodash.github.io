<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Ayekoo Dash</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1b0f08;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<meta name="theme-color" content="#1b0f08">
<style>
  html, body { background: #1b0f08; }
  #status { background: radial-gradient(circle at 50% 35%, #5a1e08, #1b0f08 70%) !important; }
  #status-splash { display: none !important; }
  #status-progress { display: none !important; }
  #ayk-load { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; text-align: center;
    font-family: system-ui, sans-serif; color: #fff6e3; }
  #ayk-load img { width: min(460px, 82vw); height: auto; }
  #ayk-bar { width: min(420px, 78vw); height: 16px; border-radius: 8px; background: rgba(255,255,255,.12);
    overflow: hidden; border: 2px solid rgba(252,209,22,.5); }
  #ayk-fill { height: 100%; width: 3%; transition: width .25s;
    background: repeating-linear-gradient(90deg, #fcd116 0 22px, #006b3f 22px 30px, #fcd116 30px 52px, #ce1126 52px 60px); }
  #ayk-pct { font-weight: 800; font-size: 1.05rem; color: #fcd116; }
  #ayk-note { font-size: .85rem; opacity: .7; max-width: 420px; line-height: 1.4; }
  #ayk-tip { font-size: 1rem; max-width: 440px; min-height: 2.8em; line-height: 1.4; transition: opacity .4s; }
  #ayk-tip b { color: #fcd116; }
</style>
<script>
  (function () {
    const tips = [
      "<b>Tip:</b> Grab <b>Chale Wote</b> sneakers and jump onto a car or trotro, then run along the roofs!",
      "<b>Tip:</b> Fill the city token meter for a free power-up and a passport stamp.",
      "<b>Tip:</b> Beat your <b>ghost</b>, your best run in each city, for bonus cedis.",
      "<b>Tip:</b> Finish all three missions to raise your score multiplier.",
      "<b>Tip:</b> Crashed? Revive for a few cedis and keep your run going.",
      "<b>Tip:</b> Come back every day: day 7 opens a <b>Susu box</b>.",
      "<b>Tip:</b> On a computer, use the arrow keys. <b>Shift</b> fires Sankofa.",
      "<b>Tip:</b> Festivals change with the seasons: double tokens and an event-only hat."
    ];
    function build() {
      const status = document.getElementById("status");
      if (!status || document.getElementById("ayk-load")) return;
      const box = document.createElement("div");
      box.id = "ayk-load";
      box.innerHTML = '<img src="loading-logo.png" alt="Ayekoo Dash">' +
        '<div id="ayk-bar"><div id="ayk-fill"></div></div>' +
        '<div id="ayk-pct">Loading…</div>' +
        '<div id="ayk-tip"></div>' +
        '<div id="ayk-note">The first visit downloads the game once (about 70 MB). Next time it opens in seconds.</div>';
      status.appendChild(box);
      let i = Math.floor(Math.random() * tips.length);
      const tip = document.getElementById("ayk-tip");
      tip.innerHTML = tips[i];
      setInterval(function () {
        tip.style.opacity = 0;
        setTimeout(function () { i = (i + 1) % tips.length; tip.innerHTML = tips[i]; tip.style.opacity = 1; }, 400);
      }, 4500);
      const prog = document.getElementById("status-progress");
      const fill = document.getElementById("ayk-fill");
      const pct = document.getElementById("ayk-pct");
      setInterval(function () {
        if (!prog) return;
        if (prog.max > 0 && prog.value > 0) {
          const p = Math.min(100, Math.round(prog.value / prog.max * 100));
          fill.style.width = Math.max(3, p) + "%";
          pct.textContent = p < 100 ? "Loading… " + p + "%" : "Starting…";
        } else if (!prog.hasAttribute("value")) {
          pct.textContent = "Starting…";
        }
      }, 200);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", build);
    else build();
  })();
</script>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":53188872,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
